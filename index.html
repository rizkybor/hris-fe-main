<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <!-- Saved appearance applied before first paint (useTheme.js). -->
    <script>
      (function () {
        var mode = "system";
        try { mode = localStorage.getItem("hris-theme") || "system"; } catch (e) {}
        var dark = mode === "dark" || (mode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
